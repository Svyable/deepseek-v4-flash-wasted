name: Quantify Gate-H layer-3 HC precision drift

on:
  push:
    branches: [agent/v7-multilayer-localization]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compare frozen Gate-H endpoint to bit-exact F32 HC semantics
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, struct, sys, tempfile
          sys.path.insert(0, 'tools')
          sys.path.insert(0, 'tests')
          import make_v7_two_layer_trace as tr
          import make_v7_layer4_route_fixture as route
          import v7_hc_oracle as hc
          import test_v6_ffn_route_real as chain

          src=tr.load_frozen_sources()
          f=src['l3']; p=f['params']
          residual=tr.bf16_floats(f['input'])
          attn=tr.bf16_floats(f['attn_branch'])
          moe=tr.bf16_floats(f['moe_branch'])

          # Independent exact-F32 path.
          apre, apost, acomb, _ = hc.params(residual,p['attn_fn'],p['attn_scale'],p['attn_base'],dim=tr.DIM)
          ipre,_=chain.cast_bf16(hc.pre_y(residual,apre,dim=tr.DIM))
          tr.exact_bits('independent attn_pre',ipre,f['attn_pre'])
          iafter_f=hc.post_y(attn,residual,apost,acomb,dim=tr.DIM)
          iafter_bits,iafter=chain.cast_bf16(iafter_f)
          fpre,fpost,fcomb,_=hc.params(iafter,p['ffn_fn'],p['ffn_scale'],p['ffn_base'],dim=tr.DIM)
          iffn,_=chain.cast_bf16(hc.pre_y(iafter,fpre,dim=tr.DIM))
          tr.exact_bits('independent ffn_pre',iffn,f['ffn_pre'])
          ifinal_f=hc.post_y(moe,iafter,fpost,fcomb,dim=tr.DIM)
          ifinal,_=chain.cast_bf16(ifinal_f)

          # Current C scalar path.
          with tempfile.TemporaryDirectory(prefix='v7-l3-drift-') as td:
              pre,post,_,_=route.build_state_lib(td)
              capre,cpost,ccomb=route.c_pre(pre,residual,p['attn_fn'],p['attn_scale'],p['attn_base'])
              capre_bits,_=chain.cast_bf16(capre)
              tr.exact_bits('C attn_pre',capre_bits,f['attn_pre'])
              cafter_f=route.c_post(post,attn,residual,cpost,ccomb)
              cafter_bits,cafter=chain.cast_bf16(cafter_f)
              cfpre,cfpost,cfcomb=route.c_pre(pre,cafter,p['ffn_fn'],p['ffn_scale'],p['ffn_base'])
              cfpre_bits,_=chain.cast_bf16(cfpre)
              tr.exact_bits('C ffn_pre',cfpre_bits,f['ffn_pre'])
              cfinal_f=route.c_post(post,moe,cafter,cfpost,cfcomb)
              cfinal,_=chain.cast_bf16(cfinal_f)

          # The new independent oracle is required to be the C path, not a new opinion.
          if [chain.f32_bits(x) for x in iafter_f] != [chain.f32_bits(x) for x in cafter_f]:
              raise SystemExit('independent/C after-attn F32 paths differ')
          if [chain.f32_bits(x) for x in ifinal_f] != [chain.f32_bits(x) for x in cfinal_f]:
              raise SystemExit('independent/C final F32 paths differ')
          if ifinal != cfinal:
              raise SystemExit('independent/C final BF16 paths differ')

          old=f['output']
          diffs=[i for i,(a,b) in enumerate(zip(cfinal,old)) if a!=b]
          if not diffs:
              raise SystemExit('expected to reproduce Gate-H endpoint drift, found none')
          raw=struct.pack(f'<{len(cfinal)}H',*cfinal)
          digest=hashlib.sha256(raw).hexdigest()
          print('CORRECTED_LAYER3_FINAL_SHA256',digest)
          print('FROZEN_LAYER3_FINAL_SHA256',hashlib.sha256(struct.pack(f'<{len(old)}H',*old)).hexdigest())
          print('BF16_DIFF_COUNT',len(diffs))
          print('FIRST_DIFFS',','.join(str(i) for i in diffs[:32]))
          for i in diffs[:16]:
              print(f'DIFF {i}: corrected=0x{cfinal[i]:04x} frozen=0x{old[i]:04x}')
          print('CORRECTED_FIRST8',' '.join(f'0x{x:04x}' for x in cfinal[:8]))
          print('PASS bit-exact F32 independent oracle and C scalar path agree exactly')
          PY
