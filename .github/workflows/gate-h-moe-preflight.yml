name: Gate H MoE preflight

on:
  push:
    branches: [agent/gate-h-layer3-full]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-h-moe-preflight
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cross the shared-expert scale-grid boundary
        run: python3 tests/test_v6_shared_expert_full_rows_scalar.py
      - name: Recompute the real Gate H FFN routing decision
        run: python3 tests/test_v6_ffn_route_real.py
      - name: Recheck the composed real attention half
        run: python3 tests/test_v6_attention_composition_real.py
