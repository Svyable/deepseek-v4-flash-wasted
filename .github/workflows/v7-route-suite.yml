name: Verify frozen V7 route in permanent suites

on:
  push:
    branches: [agent/v7-multilayer-localization]

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify route replay and complete suites
        run: |
          set -euo pipefail
          python3 tests/test_v7_layer4_route_real.py
          make check
          make asan
