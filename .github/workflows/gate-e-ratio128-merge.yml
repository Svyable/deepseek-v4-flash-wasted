name: Finalize and merge Gate E ratio-128 compressor

on:
  push:
    branches:
      - agent/gate-e-attention-ratio128
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gate-e-ratio128-finalize
  cancel-in-progress: true

jobs:
  finalize-and-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Frozen ordinary suite and sanitizers
        run: |
          set -euo pipefail
          make -j2
          make check | tee /tmp/gate-e-check.txt
          make asan | tee /tmp/gate-e-asan.txt
          test -f tests/fixtures/deepseek_v4/v5_compressor_ratio128_real/provenance.json
          test "$(stat -c %s tests/fixtures/deepseek_v4/v5_compressor_ratio128_real/pooled-before-norm.bf16.bin)" -eq 2048
          test "$(stat -c %s tests/fixtures/deepseek_v4/v5_compressor_ratio128_real/post-norm.bf16.bin)" -eq 2048
          test "$(stat -c %s tests/fixtures/deepseek_v4/v5_compressor_ratio128_real/post-yarn-rope.bf16.bin)" -eq 2048
          test "$(stat -c %s tests/fixtures/deepseek_v4/v5_compressor_ratio128_real/compressed-kv.bf16.bin)" -eq 2048

      - name: Reconcile canonical status
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('ROADMAP.md')
          s = p.read_text()
          s = s.replace(
              '| ratio-128 compressed attention | **E/V5** | **NEXT** |',
              '| ratio-128 learned compressor | **E/V5 partial** | **DONE / PR #10** |\n'
              '| ratio-128 compressed-history attention | **E/V5** | **NEXT** |')
          s = s.replace(
              '**Immediate priority: ratio-128 compressor + compressed-history attention.**',
              '**Immediate priority: ratio-128 compressed-history attention over the now-proven compressor output.**')
          p.write_text(s)

          p = Path('docs/VALIDATION.md')
          s = p.read_text()
          s = s.replace(
              'Gate E/V5 is PARTIAL: ratio-0 attention and the shared grouped-output projection are passed; ratio-128 compression and ratio-4 CSA/indexer remain.',
              'Gate E/V5 is PARTIAL: ratio-0 attention, shared grouped output projection, and the ratio-128 learned compressor are passed; ratio-128 compressed-history attention and ratio-4 CSA/indexer remain.')
          old = '''#### Ratio 128 — **NEXT**

Prove the learned compressor independently from CSA:

```text
wkv / wgate
+ learned absolute position embedding over 128-token chunks
+ softmax-weighted pooling
+ learned RMSNorm
+ compressed-position RoPE
+ K64 QAT
+ dense attention over compressed history
```
'''
          new = '''#### Ratio 128 compressor — **PASSED sub-seam**

Frozen real fixture:

```text
tests/fixtures/deepseek_v4/v5_compressor_ratio128_real/
```

Real checkpoint BF16 `wkv/wgate`, F32 APE and F32 norm are replayed across two 128-token chunks. A reduction-safe sparse input still exercises all 512 compressor outputs and all 128 per-dimension pooling positions. The scalar C path matches exactly at pooled-before-norm, post-norm, post-YaRN-RoPE and final K64-QAT compressed KV: **4,096 exact BF16 values**.

Model-free mutations distinguish per-dimension pooling from a shared softmax and compressed position-128 YaRN from ordinary base-10000 RoPE.

#### Ratio 128 compressed-history attention — **NEXT**

Reuse the frozen compressor output as evidence and prove combined compressed-history + local-window indexing/order and sink sparse-attention. Do not regenerate compressor expectations inside the attention oracle.
'''
          if old in s:
              s = s.replace(old, new)
          s = s.replace(
              '| **E** attention by type | **V5** | **PARTIAL — ratio 0 + output passed; ratio 128 next** |',
              '| **E** attention by type | **V5** | **PARTIAL — ratio 0 + output + ratio-128 compressor passed; compressed-history next** |')
          p.write_text(s)
          PY

      - name: Record green replay and remove temporary workflows
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('reference').mkdir(exist_ok=True)
          Path('reference/gate-e-ratio128-compressor-final.json').write_text(json.dumps({
              'gate': 'Gate E / V5 ratio-128 compressor sub-seam',
              'status': 'passed-frozen-replay',
              'model_revision': '9e165c30e2704aec5d9d593cce3eebd58bbef1cb',
              'github_run_id': os.environ['GITHUB_RUN_ID'],
              'validated_sha': os.environ['GITHUB_SHA'],
              'ordinary_suite': 'passed',
              'asan_ubsan': 'passed',
              'exact_bf16_diagnostics': 4096,
              'next': 'ratio-128 compressed-history attention',
          }, indent=2) + '\n')
          PY
          rm -f .github/workflows/gate-e-ratio128.yml
          rm -f .github/workflows/gate-e-ratio128-final.yml
          rm -f .github/workflows/gate-e-ratio128-finalize.yml
          rm -f .github/workflows/gate-e-ratio128-merge.yml

      - name: Push final clean branch commit
        id: final
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md docs/VALIDATION.md reference/gate-e-ratio128-compressor-final.json .github/workflows
          git commit -m "docs: finalize passed ratio-128 compressor [skip ci]"
          git push origin HEAD:agent/gate-e-attention-ratio128
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Ready and squash-merge PR 10
        run: |
          set -euo pipefail
          gh pr ready 10 || true
          gh pr merge 10 \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --match-head-commit "${{ steps.final.outputs.sha }}" \
            --subject "Pass Gate E ratio-128 compressor" \
            --body "Checkpoint/source-verified ratio-128 learned compressor: real BF16 wkv/wgate, F32 APE/norm, per-dimension 128-token pooling, explicit pool-to-BF16 boundary, learned RMSNorm, position-128 compressed YaRN, K64 QAT, 4,096 exact BF16 diagnostics, and permanent frozen-fixture replay. Gate E remains partial; compressed-history attention is next."
