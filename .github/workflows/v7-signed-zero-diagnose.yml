name: Validate V7 FP8 signed-zero oracle fix

on:
  push:
    branches: [agent/v7-multilayer-localization]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v7-signed-zero-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Differential sparse Python FP8 oracle against scalar runtime
        run: |
          set -euo pipefail
          python3 tests/test_v7_sparse_fp8_oracle.py
      - name: Recheck signed-zero E4M3 and QAT directly
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'tools')
          import make_v2_real_fixture as q
          import make_v5_attention_history_real_fixture as h
          for v, code in ((0.0,0x00),(-0.0,0x80)):
              if q.e4m3_encode(v) != code or q.bf16_bits(q.e4m3_float(code)) != (code << 8):
                  raise SystemExit(f'E4M3 signed-zero roundtrip failed for code {code:02x}')
          bits=[0]*512
          bits[333]=0x8000
          if h.qat_nope(bits)[333] != 0x8000:
              raise SystemExit('QAT lost negative zero at lane 333')
          print('PASS Python E4M3/QAT preserves signed zero exactly')
          PY
      - name: Recheck inherited real attention evidence
        run: |
          set -euo pipefail
          python3 tests/test_v5_attention_ratio128_coherent_real.py
          python3 tests/test_v5_csa_attention_real.py
          python3 tests/test_v6_attention_composition_real.py
          python3 tests/test_v6_layer3_full_real.py
