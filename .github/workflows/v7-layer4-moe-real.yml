name: Acquire complete real V7 layer-4 MoE state

on:
  push:
    branches: [agent/v7-multilayer-localization]

permissions:
  contents: write

concurrency:
  group: v7-layer4-moe-real
  cancel-in-progress: true

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MODEL: deepseek-ai/DeepSeek-V4-Flash-0731
      REVISION: 9e165c30e2704aec5d9d593cce3eebd58bbef1cb
      SNAPSHOT: reference/deepseek-v4-flash-0731
      FIXTURE: tests/fixtures/deepseek_v4/v7_layer4_full_real
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cheap bounded-acquisition preflight
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/make_v7_layer4_moe_fixture.py \
            tests/test_v7_layer4_full_real.py
          python3 tests/test_v7_hc_oracle_f32.py
          python3 tests/test_v7_sparse_fp8_oracle.py
          python3 tests/test_v7_one_row_attention_signed_zero.py
          python3 tests/test_v7_router_bias_observation.py
          python3 tests/test_v7_layer4_route_real.py
          python3 tests/test_v6_layer3_full_real.py
          set +e
          python3 tests/test_v7_layer4_full_real.py
          rc=$?
          set -e
          if [ "$rc" -ne 77 ]; then
            echo "expected full layer-4 replay to be unfrozen/skip before acquisition, got $rc" >&2
            exit 1
          fi

      - name: Fetch immutable 0731 headers
        run: |
          set -euo pipefail
          python3 tools/fetch_hf_headers.py \
            --model "$MODEL" --revision "$REVISION" --out "$SNAPSHOT"

      - name: Acquire six routed experts plus shared and compose final layer 4
        run: |
          set -euo pipefail
          rm -rf "$FIXTURE"
          python3 tools/make_v7_layer4_moe_fixture.py "$SNAPSHOT" "$FIXTURE"

      # Preserve expensive evidence before any compact replay/suite can reject
      # its surrounding test contract. Raw checkpoint expert weights are never
      # included in this artifact; only compact outputs/provenance are.
      - name: Upload arithmetic-green complete layer-4 fixture
        uses: actions/upload-artifact@v4
        with:
          name: v7-layer4-full-real
          retention-days: 30
          if-no-files-found: error
          path: tests/fixtures/deepseek_v4/v7_layer4_full_real/

      - name: Replay complete layer 4 offline
        run: |
          set -euo pipefail
          python3 tests/test_v7_layer4_full_real.py

      - name: Run frozen suites with complete layer 4 promoted to PASS
        run: |
          set -euo pipefail
          make check
          make asan

      - name: Freeze fixture only
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FIXTURE"
          if git diff --cached --quiet; then
            echo "Complete layer-4 fixture already frozen"
            exit 0
          fi
          git commit -m "reference: freeze complete real V7 layer-4 state [skip ci]"
          git push origin HEAD:agent/v7-multilayer-localization
