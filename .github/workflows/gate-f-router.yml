name: Gate F final replay

on:
  push:
    branches:
      - agent/gate-f-router-moe
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-f-router-moe
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build and ordinary check
        run: |
          make -j2
          make check

      - name: Sanitizers
        run: make asan

      - name: Verify frozen Gate F fixture is present
        run: |
          test -f tests/fixtures/deepseek_v4/v3_router_real/provenance.json
          test -f tests/fixtures/deepseek_v4/v4_routed_expert_real/provenance.json
          test -f tests/fixtures/deepseek_v4/v4_moe_real/provenance.json
          test "$(stat -c %s tests/fixtures/deepseek_v4/v4_moe_real/combined-out8.bf16.bin)" -eq 16
