name: Gate F router primitive

on:
  push:
    branches:
      - agent/gate-f-router-moe
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gate-f-router
  cancel-in-progress: true

jobs:
  router:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODEL: deepseek-ai/DeepSeek-V4-Flash-0731
      REVISION: 9e165c30e2704aec5d9d593cce3eebd58bbef1cb
      SNAPSHOT: reference/deepseek-v4-flash-0731
      FIXTURE: tests/fixtures/deepseek_v4/v3_router_real
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Existing A-D regression suite
        run: |
          make -j2
          make check
          python3 tests/test_v3_router_scalar.py

      - name: Fetch pinned headers only
        run: |
          python3 tools/fetch_hf_headers.py \
            --model "$MODEL" \
            --revision "$REVISION" \
            --out "$SNAPSHOT"

      - name: Build real learned + hash router fixture
        run: |
          rm -rf "$FIXTURE"
          python3 tools/make_v3_router_fixture.py "$SNAPSHOT" "$FIXTURE"
          test "$(stat -c %s "$FIXTURE/layer3-gate-weight.bf16.bin")" -eq 2097152
          test "$(stat -c %s "$FIXTURE/layer3-gate-bias.f32.bin")" -eq 1024
          test "$(stat -c %s "$FIXTURE/layer0-gate-weight.bf16.bin")" -eq 2097152
          test "$(stat -c %s "$FIXTURE/layer0-tid2eid-token4242.i64.bin")" -eq 48
          test "$(stat -c %s "$FIXTURE/input.bf16.bin")" -eq 8192

      - name: Replay real routers through scalar C
        run: python3 tests/test_v3_router_real.py

      - name: Sanitizers
        run: make asan

      - name: Upload router evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-f-router-real
          retention-days: 30
          if-no-files-found: error
          path: tests/fixtures/deepseek_v4/v3_router_real/

      - name: Freeze verified fixture
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "$FIXTURE" && git ls-files --error-unmatch "$FIXTURE/provenance.json" >/dev/null 2>&1; then
            echo "router fixture already frozen"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FIXTURE"
          git commit -m "fixtures: freeze real 0731 router fixture"
          git push origin HEAD:agent/gate-f-router-moe
