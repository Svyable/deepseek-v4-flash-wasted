name: Correct Gate-H final HC precision boundary

on:
  push:
    branches: [agent/gate-h-layer3-full]

permissions:
  contents: write

concurrency:
  group: gate-h-hc-precision-correct
  cancel-in-progress: true

jobs:
  correct:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact-F32 Gate-H HC migration
        run: |
          set -euo pipefail
          python3 tools/apply_gate_h_hc_precision_fix.py
          python3 -m py_compile \
            tools/deepseek_v4_hc_oracle.py \
            tools/correct_v6_layer3_hc_fixture.py \
            tests/test_v6_hc_oracle_f32.py \
            tests/test_v6_layer3_hc_precision.py \
            tests/test_v6_ffn_route_real.py
          git diff --check

      - name: Correct final layer-3 fixture offline
        run: |
          set -euo pipefail
          python3 tools/correct_v6_layer3_hc_fixture.py
          git diff --check

      - name: Run focused Gate-H precision and unchanged-seam checks
        run: |
          set -euo pipefail
          python3 tests/test_v6_hc_oracle_f32.py
          python3 tests/test_v6_attention_composition_real.py
          python3 tests/test_v6_ffn_route_real.py
          python3 tests/test_v6_moe_branch_real.py
          python3 tests/test_v6_layer3_hc_precision.py
          python3 tests/test_v6_layer3_full_real.py

      - name: Run complete frozen suites
        run: |
          set -euo pipefail
          make check
          make asan

      - name: Freeze corrected Gate-H evidence only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/test_v6_ffn_route_real.py \
            tests/run.sh \
            tests/fixtures/deepseek_v4/v6_moe_branch_real/expected-layer3-final.bf16.bin \
            tests/fixtures/deepseek_v4/v6_moe_branch_real/provenance.json
          git rm tools/apply_gate_h_hc_precision_fix.py
          git diff --cached --check
          git commit -m "fix: correct Gate-H final HC F32 boundary [skip ci]"
          git push origin HEAD:agent/gate-h-layer3-full
