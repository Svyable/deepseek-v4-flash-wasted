name: Finalize Gate E ratio-128 compressor

on:
  push:
    branches:
      - agent/gate-e-attention-ratio128
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gate-e-ratio128-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Frozen ordinary suite
        run: |
          set -euo pipefail
          make -j2
          make check | tee /tmp/gate-e-check.txt
          make asan | tee /tmp/gate-e-asan.txt
      - name: Reconcile maintained status docs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('ROADMAP.md')
          s = p.read_text()
          s = s.replace(
              '| ratio-128 compressed attention | **E/V5** | **NEXT** |',
              '| ratio-128 learned compressor | **E/V5 partial** | **DONE / PR #10** |\n'
              '| ratio-128 compressed-history attention | **E/V5** | **NEXT** |')
          s = s.replace(
              '**Immediate priority: ratio-128 compressor + compressed-history attention.**',
              '**Immediate priority: ratio-128 compressed-history attention over the now-proven compressor output.**')
          s = s.replace(
              '6. ratio-0 Q/KV/RoPE/K64-QAT/sink-sparse-attention core — partial E/V5;\n'
              '7. grouped `wo_a/wo_b` output projection — shared partial E/V5 seam.\n\nNext oracle seams:\n\n'
              '1. ratio-128 learned compressor + compressed-history attention;',
              '6. ratio-0 Q/KV/RoPE/K64-QAT/sink-sparse-attention core — partial E/V5;\n'
              '7. grouped `wo_a/wo_b` output projection — shared partial E/V5 seam;\n'
              '8. ratio-128 learned compressor — partial E/V5.\n\nNext oracle seams:\n\n'
              '1. ratio-128 compressed-history attention over frozen compressor output;')
          p.write_text(s)

          p = Path('docs/VALIDATION.md')
          s = p.read_text()
          s = s.replace(
              '**Status: Gates A/V0, B/V1, C/V2, README Gate D\'s mHC seam, and Gate F/V4 are passed at their stated scalar/model-semantic evidence levels. Gate E/V5 is PARTIAL: ratio-0 attention and the shared grouped-output projection are passed; ratio-128 compression and ratio-4 CSA/indexer remain. Gate G still owns converted-record/cache identity.**',
              '**Status: Gates A/V0, B/V1, C/V2, README Gate D\'s mHC seam, and Gate F/V4 are passed at their stated scalar/model-semantic evidence levels. Gate E/V5 is PARTIAL: ratio-0 attention, shared grouped output projection, and the ratio-128 learned compressor are passed; ratio-128 compressed-history attention and ratio-4 CSA/indexer remain. Gate G still owns converted-record/cache identity.**')
          old = '''#### Ratio 128 — **NEXT**

Prove the learned compressor independently from CSA:

```text
wkv / wgate
+ learned absolute position embedding over 128-token chunks
+ softmax-weighted pooling
+ learned RMSNorm
+ compressed-position RoPE
+ K64 QAT
+ dense attention over compressed history
```
'''
          new = '''#### Ratio 128 compressor — **PASSED sub-seam**

Frozen real fixture:

```text
tests/fixtures/deepseek_v4/v5_compressor_ratio128_real/
```

Real checkpoint `wkv/wgate` BF16 weights, F32 APE and F32 norm are replayed over two 128-token chunks. A reduction-safe sparse input leaves one non-zero hidden lane in each chunk while exercising all 512 outputs and all 128 per-dimension pooling positions. Ordinary C replay matches exactly at four `[2,512]` BF16 boundaries: pooled-before-norm, post-norm, post-YaRN-RoPE, and final K64-QAT compressed KV — **4,096 exact BF16 values** total.

Model-free mutations distinguish per-dimension pooling from a shared softmax and compressed position-128 YaRN from ordinary base-10000 RoPE.

#### Ratio 128 compressed-history attention — **NEXT**

Use the frozen compressor output as input evidence and prove the combined compressed-history + local-window cache/index ordering and sink sparse-attention result. Do not regenerate compressor expectations inside the attention oracle.
'''
          if old in s:
              s = s.replace(old, new)
          s = s.replace(
              '| **E** attention by type | **V5** | **PARTIAL — ratio 0 + output passed; ratio 128 next** |',
              '| **E** attention by type | **V5** | **PARTIAL — ratio 0 + output + ratio-128 compressor passed; compressed-history next** |')
          p.write_text(s)
          PY
      - name: Record final replay evidence and remove temporary workflows
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('reference').mkdir(exist_ok=True)
          doc = {
            'gate': 'Gate E / V5 ratio-128 compressor sub-seam',
            'status': 'passed-frozen-replay',
            'model_revision': '9e165c30e2704aec5d9d593cce3eebd58bbef1cb',
            'github_run_id': os.environ['GITHUB_RUN_ID'],
            'github_sha': os.environ['GITHUB_SHA'],
            'ordinary_suite': 'passed',
            'asan_ubsan': 'passed',
            'fixture': 'tests/fixtures/deepseek_v4/v5_compressor_ratio128_real',
            'exact_bf16_diagnostics': 4096,
            'next': 'ratio-128 compressed-history attention',
          }
          Path('reference/gate-e-ratio128-compressor-final.json').write_text(json.dumps(doc, indent=2) + '\n')
          PY
          rm -f .github/workflows/gate-e-ratio128.yml
          rm -f .github/workflows/gate-e-ratio128-final.yml
          rm -f .github/workflows/gate-e-ratio128-finalize.yml
      - name: Commit successful finalization
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md docs/VALIDATION.md reference/gate-e-ratio128-compressor-final.json .github/workflows
          git commit -m "docs: finalize passed ratio-128 compressor [skip ci]"
          git push origin HEAD:agent/gate-e-attention-ratio128
