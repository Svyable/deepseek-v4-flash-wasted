name: Inventory official layer-3 Gate H tensor surface

on:
  push:
    branches:
      - agent/gate-h-layer3-full
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gate-h-layer3-inventory
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODEL: deepseek-ai/DeepSeek-V4-Flash-0731
      REVISION: 9e165c30e2704aec5d9d593cce3eebd58bbef1cb
      SNAPSHOT: reference/deepseek-v4-flash-0731
      OUT: reference/deepseek-v4-flash-0731.layer3-gate-h.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Frozen baseline
        run: |
          set -euo pipefail
          make -j2
          make check

      - name: Fetch immutable 0731 headers
        run: |
          set -euo pipefail
          python3 tools/fetch_hf_headers.py \
            --model "$MODEL" \
            --revision "$REVISION" \
            --out "$SNAPSHOT"

      - name: Extract exact layer-3 tensor surface
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, struct
          from collections import Counter, defaultdict
          from pathlib import Path

          snap = Path(os.environ['SNAPSHOT'])
          out = Path(os.environ['OUT'])
          rev = os.environ['REVISION']
          model = os.environ['MODEL']

          config = json.loads((snap / 'config.json').read_text())
          index = json.loads((snap / 'model.safetensors.index.json').read_text())
          headers_manifest = json.loads((snap / 'reference_headers.json').read_text())
          weight_map = index['weight_map']

          ratios = config.get('compress_ratios')
          if not isinstance(ratios, list) or len(ratios) <= 3 or ratios[3] != 128:
              raise SystemExit(f'layer 3 compress_ratio mismatch: {ratios!r}')
          if config.get('hc_mult') != 4:
              raise SystemExit(f"hc_mult mismatch: {config.get('hc_mult')!r}")

          cache = {}
          def shard_header(shard):
              if shard in cache:
                  return cache[shard]
              path = snap / shard
              with path.open('rb') as f:
                  raw = f.read(8)
                  if len(raw) != 8:
                      raise SystemExit(f'{shard}: truncated stub')
                  (hlen,) = struct.unpack('<Q', raw)
                  blob = f.read(hlen)
                  if len(blob) != hlen:
                      raise SystemExit(f'{shard}: truncated JSON header')
              hdr = json.loads(blob)
              cache[shard] = (hlen, hdr)
              return cache[shard]

          names = sorted(n for n in weight_map if n.startswith('layers.3.'))
          if not names:
              raise SystemExit('no layers.3.* tensors found')

          def classify(name):
              tail = name[len('layers.3.'):]
              if tail.startswith('hc_attn_'):
                  return 'hc_attn'
              if tail.startswith('hc_ffn_'):
                  return 'hc_ffn'
              if tail.startswith('attn.'):
                  return 'attention'
              if tail.startswith('mlp.shared_experts.'):
                  return 'mlp_shared'
              if tail.startswith('mlp.experts.'):
                  return 'mlp_routed'
              if tail.startswith('mlp.gate.'):
                  return 'router'
              if tail.startswith('mlp.'):
                  return 'mlp_other'
              return 'other'

          rows = []
          groups = defaultdict(lambda: {'tensor_count': 0, 'payload_bytes': 0, 'dtype_counts': Counter(), 'names': []})
          for name in names:
              shard = weight_map[name]
              hlen, hdr = shard_header(shard)
              if name not in hdr:
                  raise SystemExit(f'{name}: missing from {shard} header')
              meta = hdr[name]
              begin, end = meta['data_offsets']
              absolute_start = 8 + hlen + begin
              absolute_end = 8 + hlen + end
              group = classify(name)
              row = {
                  'name': name,
                  'group': group,
                  'dtype': meta['dtype'],
                  'shape': meta['shape'],
                  'payload_bytes': end - begin,
                  'shard': shard,
                  'data_offsets': [begin, end],
                  'absolute_range_half_open': [absolute_start, absolute_end],
                  'shard_remote_file_bytes': headers_manifest['shards'][shard].get('remote_file_bytes'),
              }
              rows.append(row)
              g = groups[group]
              g['tensor_count'] += 1
              g['payload_bytes'] += row['payload_bytes']
              g['dtype_counts'][row['dtype']] += 1
              if group not in ('mlp_routed',):
                  g['names'].append(name)

          # Routed experts are intentionally summarized by exact count/bytes and
          # a deterministic sample; the full per-tensor rows remain below.
          routed = [r for r in rows if r['group'] == 'mlp_routed']
          if not routed:
              raise SystemExit('layer 3 inventory has no routed expert tensors')
          groups['mlp_routed']['names'] = [r['name'] for r in routed[:18]]
          groups['mlp_routed']['name_sample_truncated'] = len(routed) > 18

          required_groups = {'hc_attn','hc_ffn','attention','router','mlp_routed','mlp_shared'}
          missing = sorted(required_groups - set(groups))
          if missing:
              raise SystemExit(f'missing expected layer-3 groups: {missing}')

          # HC names are a new Gate-H acquisition surface and must be explicit.
          hc_names = sorted(r['name'] for r in rows if r['group'] in ('hc_attn','hc_ffn'))
          expected_hc = {
              'layers.3.hc_attn_fn', 'layers.3.hc_attn_base', 'layers.3.hc_attn_scale',
              'layers.3.hc_ffn_fn', 'layers.3.hc_ffn_base', 'layers.3.hc_ffn_scale',
          }
          if set(hc_names) != expected_hc:
              raise SystemExit(f'layer-3 HC export surface mismatch: {hc_names}')

          group_doc = {}
          for name, g in sorted(groups.items()):
              group_doc[name] = {
                  'tensor_count': g['tensor_count'],
                  'payload_bytes': g['payload_bytes'],
                  'dtype_counts': dict(sorted(g['dtype_counts'].items())),
                  'names': g['names'],
              }
              if 'name_sample_truncated' in g:
                  group_doc[name]['name_sample_truncated'] = g['name_sample_truncated']

          doc = {
              'schema_version': 1,
              'model': model,
              'revision': rev,
              'layer': 3,
              'compress_ratio': ratios[3],
              'hc_mult': config.get('hc_mult'),
              'source': 'official immutable Hugging Face safetensors headers',
              'config_sha256': hashlib.sha256((snap / 'config.json').read_bytes()).hexdigest(),
              'index_sha256': hashlib.sha256((snap / 'model.safetensors.index.json').read_bytes()).hexdigest(),
              'official_block_order': [
                  'hc_pre(hc_attn_fn, hc_attn_base, hc_attn_scale)',
                  'Attention(y)',
                  'hc_post(attention)',
                  'hc_pre(hc_ffn_fn, hc_ffn_base, hc_ffn_scale)',
                  'MoE(y,input_ids)',
                  'hc_post(ffn)',
              ],
              'config_contract': {
                  'hidden_size': config.get('hidden_size'),
                  'hc_mult': config.get('hc_mult'),
                  'num_hidden_layers': config.get('num_hidden_layers'),
                  'num_attention_heads': config.get('num_attention_heads'),
                  'head_dim': config.get('head_dim'),
                  'n_routed_experts': config.get('n_routed_experts'),
                  'n_shared_experts': config.get('n_shared_experts'),
                  'num_experts_per_tok': config.get('num_experts_per_tok'),
                  'compress_ratio': ratios[3],
              },
              'groups': group_doc,
              'totals': {
                  'tensor_count': len(rows),
                  'payload_bytes': sum(r['payload_bytes'] for r in rows),
              },
              'tensors': rows,
          }
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(doc, indent=2, sort_keys=True) + '\n')

          print(f"layer3 tensors: {len(rows)}")
          print(f"layer3 payload: {doc['totals']['payload_bytes']} bytes")
          for name, g in group_doc.items():
              print(f"  {name}: {g['tensor_count']} tensors, {g['payload_bytes']} bytes, {g['dtype_counts']}")
          print('HC surface:')
          for name in hc_names:
              row = next(r for r in rows if r['name'] == name)
              print(' ', name, row['dtype'], row['shape'], row['payload_bytes'], row['shard'])
          PY

      - name: Upload Gate H inventory
        uses: actions/upload-artifact@v4
        with:
          name: gate-h-layer3-header-inventory
          retention-days: 30
          if-no-files-found: error
          path: reference/deepseek-v4-flash-0731.layer3-gate-h.json

      - name: Freeze checkpoint-derived inventory
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then
            echo "layer-3 Gate H inventory already frozen"
            exit 0
          fi
          git commit -m "reference: freeze official layer-3 Gate H tensor inventory [skip ci]"
          git push origin HEAD:agent/gate-h-layer3-full
