name: Acquire coherent real 0731 ratio-128 attention

on:
  push:
    branches:
      - agent/gate-e-attention-ratio128-coherent
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gate-e-ratio128-coherent-acquire
  cancel-in-progress: true

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MODEL: deepseek-ai/DeepSeek-V4-Flash-0731
      REVISION: 9e165c30e2704aec5d9d593cce3eebd58bbef1cb
      SNAPSHOT: reference/deepseek-v4-flash-0731
      FIXTURE: tests/fixtures/deepseek_v4/v5_attention_ratio128_coherent_real
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cheap source-contract preflight
        run: |
          set -euo pipefail
          python3 tests/test_v5_compressed_inverse_scalar.py
          python3 tests/test_v5_compressor_real.py
          python3 tests/test_v5_attention_history_scalar.py
          python3 tests/test_v5_attention_history_real.py
          make -j2
          make check

      - name: Fetch immutable 0731 safetensors headers
        run: |
          set -euo pipefail
          python3 tools/fetch_hf_headers.py \
            --model "$MODEL" \
            --revision "$REVISION" \
            --out "$SNAPSHOT"

      - name: Build coherent same-input fixture
        run: |
          set -euo pipefail
          rm -rf "$FIXTURE"
          python3 tools/make_v5_attention_ratio128_coherent_fixture.py "$SNAPSHOT" "$FIXTURE"
          test "$(stat -c %s "$FIXTURE/wq-a.fp8.bin")" -eq 4194304
          test "$(stat -c %s "$FIXTURE/wq-a-scale.e8m0.bin")" -eq 256
          test "$(stat -c %s "$FIXTURE/q-norm.bf16.bin")" -eq 2048
          test "$(stat -c %s "$FIXTURE/wq-b-head0.fp8.bin")" -eq 524288
          test "$(stat -c %s "$FIXTURE/wq-b-scale-head0.e8m0.bin")" -eq 32
          test "$(stat -c %s "$FIXTURE/wkv.fp8.bin")" -eq 2097152
          test "$(stat -c %s "$FIXTURE/wkv-scale.e8m0.bin")" -eq 128
          test "$(stat -c %s "$FIXTURE/kv-norm.bf16.bin")" -eq 1024
          test "$(stat -c %s "$FIXTURE/attn-sink-head0.f32.bin")" -eq 4
          test "$(stat -c %s "$FIXTURE/q-pos255-head0.bf16.bin")" -eq 1024
          test "$(stat -c %s "$FIXTURE/local-kv-active-0-255.bf16.bin")" -eq 2048
          test "$(stat -c %s "$FIXTURE/compressed-kv-coherent.bf16.bin")" -eq 2048
          test "$(stat -c %s "$FIXTURE/attn-pre-inverse.bf16.bin")" -eq 1024
          test "$(stat -c %s "$FIXTURE/attn-post-inverse.bf16.bin")" -eq 1024
          test "$(stat -c %s "$FIXTURE/topk-row255.i32.bin")" -eq 520

      - name: Replay coherent chain through scalar C
        run: python3 tests/test_v5_attention_ratio128_coherent_real.py

      - name: Upload coherent evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-e-ratio128-coherent-real
          retention-days: 30
          if-no-files-found: error
          path: tests/fixtures/deepseek_v4/v5_attention_ratio128_coherent_real/

      - name: Freeze verified coherent fixture
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FIXTURE"
          if git diff --cached --quiet; then
            echo "coherent fixture already frozen"
            exit 0
          fi
          git commit -m "fixtures: freeze coherent real 0731 ratio-128 attention [skip ci]"
          git push origin HEAD:agent/gate-e-attention-ratio128-coherent
