name: Validate Gate-I scalar head primitive

on:
  push:
    branches: [agent/gate-i-v8-head-primitive]
    paths:
      - ".github/workflows/v8-head-primitive-preflight.yml"
      - "src/deepseek_v4_head_ref.c"
      - "src/deepseek_v4_head_ref.h"
      - "tests/test_v8_head_ref.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Stacked-parent and scalar differential
        run: |
          set -euo pipefail
          python3 tests/test_v7_parent_freshness.py
          python3 tests/test_v7_two_layer_real.py
          python3 tests/test_v8_head_surface.py
          python3 -m py_compile tests/test_v8_head_ref.py
          python3 tests/test_v8_head_ref.py
          git diff --check
