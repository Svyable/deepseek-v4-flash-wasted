name: Acquire real layer-3 Gate H HC composition

on:
  push:
    branches:
      - agent/gate-h-layer3-full
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gate-h-layer3-hc-real
  cancel-in-progress: true

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MODEL: deepseek-ai/DeepSeek-V4-Flash-0731
      REVISION: 9e165c30e2704aec5d9d593cce3eebd58bbef1cb
      SNAPSHOT: reference/deepseek-v4-flash-0731
      FIXTURE: tests/fixtures/deepseek_v4/v6_hc_composition_real
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cheap Gate H preflight
        run: |
          set -euo pipefail
          python3 tests/test_v6_layer_composition_scalar.py
          make -j2
          make check

      - name: Fetch immutable 0731 headers
        run: |
          set -euo pipefail
          python3 tools/fetch_hf_headers.py \
            --model "$MODEL" \
            --revision "$REVISION" \
            --out "$SNAPSHOT"

      - name: Build real two-HC fixture from bounded official tensors
        run: |
          set -euo pipefail
          rm -rf "$FIXTURE"
          python3 tools/make_v6_hc_composition_fixture.py "$SNAPSHOT" "$FIXTURE"

      - name: Replay real layer-3 HC composition through C
        run: |
          set -euo pipefail
          python3 tests/test_v6_hc_composition_real.py

      - name: Upload frozen-candidate fixture
        uses: actions/upload-artifact@v4
        with:
          name: gate-h-layer3-hc-composition-real
          retention-days: 30
          if-no-files-found: error
          path: tests/fixtures/deepseek_v4/v6_hc_composition_real/

      - name: Freeze green fixture
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FIXTURE"
          if git diff --cached --quiet; then
            echo "Gate H HC fixture already frozen"
            exit 0
          fi
          git commit -m "reference: freeze real layer-3 Gate H HC composition [skip ci]"
          git push origin HEAD:agent/gate-h-layer3-full
