name: Gate D real mHC

on:
  push:
    branches:
      - agent/gate-d-mhc
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gate-d-mhc
  cancel-in-progress: true

jobs:
  gate-d:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODEL: deepseek-ai/DeepSeek-V4-Flash-0731
      REVISION: 9e165c30e2704aec5d9d593cce3eebd58bbef1cb
      SNAPSHOT: reference/deepseek-v4-flash-0731
      FIXTURE: tests/fixtures/deepseek_v4/v3_mhc_real
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Existing build and checks
        run: |
          make -j2
          make check
          python3 tests/test_v3_mhc_scalar.py

      - name: Fetch pinned headers only
        run: |
          python3 tools/fetch_hf_headers.py \
            --model "$MODEL" \
            --revision "$REVISION" \
            --out "$SNAPSHOT"

      - name: Build real mHC fixture
        run: |
          rm -rf "$FIXTURE"
          python3 tools/make_v3_mhc_fixture.py "$SNAPSHOT" "$FIXTURE"
          test "$(stat -c %s "$FIXTURE/hc_attn_fn.f32.bin")" -eq 1572864
          test "$(stat -c %s "$FIXTURE/hc_attn_base.f32.bin")" -eq 96
          test "$(stat -c %s "$FIXTURE/hc_attn_scale.f32.bin")" -eq 12
          test "$(stat -c %s "$FIXTURE/residual.bf16.bin")" -eq 32768
          test "$(stat -c %s "$FIXTURE/branch.bf16.bin")" -eq 8192
          test "$(stat -c %s "$FIXTURE/expected-pre.bf16.bin")" -eq 8192
          test "$(stat -c %s "$FIXTURE/expected-post.bf16.bin")" -eq 32768
          test "$(stat -c %s "$FIXTURE/expected-diagnostics.f32.bin")" -eq 192

      - name: Replay real mHC fixture through scalar C
        run: python3 tests/test_v3_mhc_real.py

      - name: Sanitizers
        run: make asan

      - name: Upload Gate D evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-d-real-mhc
          retention-days: 30
          if-no-files-found: error
          path: tests/fixtures/deepseek_v4/v3_mhc_real/

      - name: Freeze verified fixture
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "$FIXTURE" && git ls-files --error-unmatch "$FIXTURE/provenance.json" >/dev/null 2>&1; then
            echo "real Gate D fixture already frozen"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FIXTURE"
          git commit -m "fixtures: freeze real 0731 Gate D mHC fixture"
          git push origin HEAD:agent/gate-d-mhc
