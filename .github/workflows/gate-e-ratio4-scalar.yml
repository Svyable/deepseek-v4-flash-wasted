name: Verify ratio-4 CSA scalar contract

on:
  push:
    branches:
      - agent/gate-e-attention-ratio4-csa
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-e-ratio4-scalar
  cancel-in-progress: true

jobs:
  scalar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Ratio-4 CSA model-free contract
        run: python3 tests/test_v5_csa_scalar.py
      - name: Frozen baseline
        run: |
          make -j2
          make check
      - name: Sanitizers
        run: make asan
