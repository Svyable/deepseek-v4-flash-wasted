name: Acquire full real layer-3 Gate H attention branch

on:
  push:
    branches: [agent/gate-h-layer3-full]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gate-h-attention-branch-real
  cancel-in-progress: true

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MODEL: deepseek-ai/DeepSeek-V4-Flash-0731
      REVISION: 9e165c30e2704aec5d9d593cce3eebd58bbef1cb
      SNAPSHOT: reference/deepseek-v4-flash-0731
      FIXTURE: tests/fixtures/deepseek_v4/v6_attention_branch_real
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cheap permanent-dependency preflight
        run: |
          set -euo pipefail
          python3 tests/test_v6_attention_output_full_scalar.py
          python3 tests/test_v6_layer_composition_scalar.py
          python3 tests/test_v6_hc_composition_real.py
      - name: Fetch immutable 0731 headers
        run: |
          set -euo pipefail
          python3 tools/fetch_hf_headers.py --model "$MODEL" --revision "$REVISION" --out "$SNAPSHOT"
      - name: Build and cross-check complete 64-head attention branch
        run: |
          set -euo pipefail
          rm -rf "$FIXTURE"
          python3 tools/make_v6_attention_branch_fixture.py "$SNAPSHOT" "$FIXTURE"
      - name: Upload compact checkpoint-derived branch fixture
        uses: actions/upload-artifact@v4
        with:
          name: gate-h-layer3-attention-branch-real
          retention-days: 30
          if-no-files-found: error
          path: tests/fixtures/deepseek_v4/v6_attention_branch_real/
      - name: Freeze green compact fixture
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FIXTURE"
          # The fixture is already frozen at deaee26 and the generator is
          # deterministic, so every push after the first has nothing to commit.
          # Without this guard `git commit` exits non-zero, `set -e` takes the
          # job down, and a green acquisition reports as a red check for the
          # rest of the branch's life. The ratio-128 workflow carried the same
          # guard; this one was written without it.
          if git diff --cached --quiet; then
            echo "attention-branch fixture already frozen and unchanged"
            exit 0
          fi
          git commit -m "reference: freeze full real layer-3 Gate H attention branch [skip ci]"
          git push origin HEAD:agent/gate-h-layer3-full
