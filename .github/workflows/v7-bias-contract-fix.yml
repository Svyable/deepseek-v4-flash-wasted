name: Validate V7 correction-bias observation contract

on:
  push:
    branches: [agent/v7-multilayer-localization]

permissions:
  contents: write

concurrency:
  group: v7-bias-contract-fix
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic bias-contract patch
        run: |
          set -euo pipefail
          python3 tools/apply_v7_bias_observation_fix.py
          chmod +x tests/test_v7_router_bias_observation.py
          python3 -m py_compile \
            tools/make_v7_layer4_route_fixture.py \
            tests/test_v7_layer4_route_real.py \
            tests/test_v7_router_bias_observation.py
          git diff --check
          if grep -n 'correction-bias selection is invisible' tools/make_v7_layer4_route_fixture.py; then
            echo 'over-strong bias visibility assertion remains' >&2
            exit 1
          fi

      - name: Run bias semantics and inherited precision gates
        run: |
          set -euo pipefail
          python3 tests/test_v7_router_bias_observation.py
          python3 tests/test_v7_hc_oracle_f32.py
          python3 tests/test_v7_sparse_fp8_oracle.py
          python3 tests/test_v7_one_row_attention_signed_zero.py
          python3 tests/test_v7_localize.py
          python3 tests/test_v6_ffn_route_real.py
          make check

      - name: Freeze corrected contract and remove temporary machinery
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/make_v7_layer4_route_fixture.py \
                  tests/test_v7_layer4_route_real.py \
                  tests/test_v7_router_bias_observation.py \
                  tests/run.sh
          git rm tools/apply_v7_bias_observation_fix.py .github/workflows/v7-bias-contract-fix.yml
          git diff --cached --check
          git commit -m "test: distinguish correction-bias operation from top-k outcome [skip ci]"
          git push origin HEAD:agent/v7-multilayer-localization
