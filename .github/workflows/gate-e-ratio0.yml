name: Gate E final replay

on:
  push:
    branches:
      - agent/gate-e-attention-ratio0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-e-ratio0
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and ordinary check
        run: |
          make -j2
          make check
      - name: Sanitizers
        run: make asan
      - name: Verify frozen Gate E fixtures
        run: |
          test -f tests/fixtures/deepseek_v4/v5_attn_ratio0_real/provenance.json
          test -f tests/fixtures/deepseek_v4/v5_attn_output_group0_real/provenance.json
          test "$(stat -c %s tests/fixtures/deepseek_v4/v5_attn_ratio0_real/attn-after-inverse-rope.bf16.bin)" -eq 4096
          test "$(stat -c %s tests/fixtures/deepseek_v4/v5_attn_output_group0_real/expected-out8.bf16.bin)" -eq 16
