name: Integrate frozen coherent ratio-128 evidence

on:
  push:
    branches:
      - agent/gate-e-attention-ratio128-coherent
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gate-e-ratio128-coherent-integrate
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile permanent gate surfaces
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tests/run.sh')
          s = p.read_text()
          anchor = 'deepseek_replay "Gate E/V5 — real ratio-128 compressed-history composition" \\\n                "test_v5_attention_history_real.py"\n'
          extra = (anchor
                   + 'deepseek_replay "Gate E/V5 — model-free inverse compressed YaRN pair20" \\\n                "test_v5_compressed_inverse_scalar.py"\n'
                   + 'deepseek_replay "Gate E/V5 — coherent same-input ratio-128 attention" \\\n                "test_v5_attention_ratio128_coherent_real.py"\n')
          if 'test_v5_attention_ratio128_coherent_real.py' not in s:
              if anchor not in s:
                  raise SystemExit('run.sh coherent insertion anchor missing')
              s = s.replace(anchor, extra, 1)
          s = s.replace(
              '# Gate E/V5 — PARTIAL. Ratio-0 attention and the shared grouped-output\n# projection have real fixtures; ratio-128 compression and ratio-4 CSA do\n# not, and get their lines when they do.',
              '# Gate E/V5 — PARTIAL. Ratio-0, grouped output, and coherent ratio-128\n# now have real fixtures. Ratio-4 CSA/indexer remains the open attention mode.')
          p.write_text(s)

          p = Path('ROADMAP.md')
          s = p.read_text()
          s = s.replace(
              '| coherent same-input ratio-128 forward | **E/V5** | **NEXT** |\n| ratio-4 CSA/indexer attention | **E/V5** | after ratio-128; completes Gate E |',
              '| coherent same-input ratio-128 forward | **E/V5 partial** | **CHECKPOINT-PASSED**, one head / row 255 through inverse compressed RoPE |\n| ratio-4 CSA/indexer attention | **E/V5** | **NEXT**; completes Gate E |')
          s = s.replace(
              '**Immediate priority: coherent same-input ratio-128 forward through inverse compressed RoPE, then ratio-4 CSA/indexer.**',
              '**Immediate priority: ratio-4 CSA/indexer; coherent ratio-128 is now checkpoint-passed through inverse compressed RoPE.**')
          p.write_text(s)

          p = Path('docs/VALIDATION.md')
          s = p.read_text()
          s = s.replace(
              "Gate E/V5 is PARTIAL: ratio-0 attention, the shared grouped-output projection, the real ratio-128 compressor, and a real ratio-128 compressed-history composition seam are passed. A coherent same-input ratio-128 forward and ratio-4 CSA/indexer remain.",
              "Gate E/V5 is PARTIAL: ratio-0 attention, the shared grouped-output projection, and a coherent same-input real ratio-128 forward through inverse compressed RoPE are passed. Ratio-4 CSA/indexer remains.")
          old = ('#### Ratio 128 coherent forward — **NEXT**\n\n'
                 'Use one input sequence for local Q/KV and compressor KV and prove through sparse attention plus inverse compressed RoPE. The already-proven shared output projection may then be attached without reopening its orientation.\n\n')
          new = ('#### Ratio 128 coherent forward — **PASSED real-checkpoint sub-seam**\n\n'
                 'Frozen fixture: `tests/fixtures/deepseek_v4/v5_attention_ratio128_coherent_real/`. A single 256-token structural input has only positions 0 and 255 non-zero. The same input drives real layer-3 head-0 Q, local KV, both ratio-128 compressor chunks, row-255 local+compressed sparse attention, and inverse compressed YaRN.\n\n'
                 'The offline C replay regenerates every stage from the frozen raw checkpoint slices and the already-proven compressor payload. The row-255 namespace is 130 exact indices (`128..255,256,257`). Pre-inverse and post-inverse attention are each 512 exact BF16 values. Pair 20 changes from `3abf 3b49` to `3add 3b41`; replacing coherent compressed KV with the older unrelated compressor fixture also changes attention.\n\n'
                 '**Boundary:** one head / one query row only. The shared grouped output projection is already proved separately; ratio-4 CSA/indexer remains the final Gate-E attention mode.\n\n')
          if old not in s:
              raise SystemExit('VALIDATION coherent section anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace(
              '| **E** attention by type | **V5** | **PARTIAL — ratio 0 + output passed; ratio-128 compressor model-free only, real fixture pending; CSA next** |',
              '| **E** attention by type | **V5** | **PARTIAL — ratio 0 + output + coherent ratio-128 checkpoint-passed; ratio-4 CSA/indexer next** |')
          p.write_text(s)

          p = Path('docs/ATTENTION.md')
          s = p.read_text()
          s = s.replace(
              '**Current state: Gate E / V5 is PARTIAL. Ratio-0 attention, the shared grouped output projection, the ratio-128 learned compressor, and a ratio-128 compressed-history composition seam are checkpoint/source verified at the scalar model-semantic level. A coherent same-input ratio-128 `Attention.forward` fixture and ratio-4 CSA/indexer attention remain open.**',
              '**Current state: Gate E / V5 is PARTIAL. Ratio-0 attention, the shared grouped output projection, and coherent same-input ratio-128 attention through inverse compressed RoPE are checkpoint/source verified at the scalar model-semantic level. Ratio-4 CSA/indexer is the remaining attention mode.**')
          start = s.index('## 9. Next — coherent ratio-128 forward, then ratio-4 CSA/indexer')
          replacement = (
              '## 9. Coherent same-input ratio-128 forward — PASSED real-checkpoint sub-seam\n\n'
              'Frozen fixture:\n\n```text\ntests/fixtures/deepseek_v4/v5_attention_ratio128_coherent_real/\n```\n\n'
              'One 256-token BF16 structural input has exactly two non-zero tokens: position 0 (`lane 17`, `0x3da0`) and position 255 (`lane 3340`, `0xbf20`). The same input drives real layer-3 head-0 Q/local KV, the real learned ratio-128 compressor, the 130-entry row-255 history namespace, sink sparse attention, and inverse compressed YaRN.\n\n'
              'The fixture freezes the bounded real layer-3 attention slices, while compressor weights/APE/norm are dependency-hashed from the earlier real compressor fixture. The independent Python oracle shares no WASTE runtime code; the offline C replay reconstructs the whole chain from the same input.\n\n'
              'Exact representative evidence:\n\n```text\ncoherent compressed KV first8\n3a60 3b90 3c70 3960 3a10 b9c0 b860 baf0\n\npre-inverse attention first8\n3ba7 b9d9 b7a3 bb5f 3baf baf1 3ab3 ba71\n\npost-inverse attention first8\n3ba7 b9d9 b7a3 bb5f 3baf baf1 3ab3 ba71\n\npair20 pre  3abf 3b49\npair20 post 3add 3b41\n```\n\n'
              'The identical first eight values are expected because inverse RoPE touches only the final 64 dimensions; pair 20 is inside that tail and is the load-bearing discriminator. Replacing coherent compressed history with the older unrelated compressor fixture must change the pre-inverse result.\n\n'
              'Acquisition evidence:\n\n```text\nworkflow run 31328790368\nartifact id 9042319671\nartifact sha256 b48e6518ce82dac74354325f16f1da80ddb4367624a313bdf9afbef9d4294497\nfixture freeze d12cb39a36973dab70a6005b05fffc664b0bec6d\n```\n\n'
              '**Boundary:** one head and one query row. The shared grouped output projection was proved independently in section 5 and is not redundantly re-opened here.\n\n'
              '## 10. Next — ratio-4 CSA/indexer\n\n'
              'Ratio-4 is now the only remaining Gate-E attention mode. It adds:\n\n'
              '- overlapping two-half compressor behavior;\n'
              '- its own 128-dimensional indexer compressor;\n'
              '- Hadamard rotation and FP4 simulation where the pinned source applies them;\n'
              '- 64 indexer heads × 128 dimensions;\n'
              '- BF16 `weights_proj` weighting;\n'
              '- exact top-512 compressed-position selection/order;\n'
              '- sparse attention over the selected compressed history.\n\n'
              'Gate E / V5 closes only after that ratio-4/CSA seam has independent checkpoint/source evidence.\n')
          s = s[:start] + replacement
          s = s.replace(
              '- real ratio-128 compressed-history composition.\n',
              '- real ratio-128 compressed-history composition;\n- model-free inverse compressed-YaRN pair-20 mutation;\n- coherent same-input real ratio-128 forward through inverse compressed RoPE.\n')
          p.write_text(s)
          PY

      - name: Frozen no-network validation
        run: |
          set -euo pipefail
          python3 tests/test_v5_compressed_inverse_scalar.py
          python3 tests/test_v5_attention_ratio128_coherent_real.py
          make -j2
          make check | tee /tmp/check.log
          make asan | tee /tmp/asan.log
          grep -q 'Gate E/V5 — model-free inverse compressed YaRN pair20' /tmp/check.log
          grep -q 'Gate E/V5 — coherent same-input ratio-128 attention' /tmp/check.log

      - name: Remove one-shot workflow and commit green integration
        run: |
          set -euo pipefail
          rm -f .github/workflows/gate-e-ratio128-coherent-integrate.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/run.sh ROADMAP.md docs/VALIDATION.md docs/ATTENTION.md .github/workflows
          git commit -m "validation: make coherent ratio-128 evidence permanent [skip ci]"
          git push origin HEAD:agent/gate-e-attention-ratio128-coherent
