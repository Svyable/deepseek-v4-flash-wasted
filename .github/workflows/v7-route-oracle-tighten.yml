name: Validate exact V7 HC route oracle

on:
  push:
    branches: [agent/v7-multilayer-localization]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tighten route producer to exact F32 HC coefficients
        run: |
          set -euo pipefail
          python3 tools/tighten_v7_route_oracle.py
          python3 -m py_compile tools/make_v7_layer4_route_fixture.py
          git diff --check
          if grep -n 'param_delta\|HC-attn post/comb oracle delta\|HC-FFN post/comb oracle delta' tools/make_v7_layer4_route_fixture.py; then
            echo 'stale HC tolerance logic remains' >&2
            exit 1
          fi

      - name: Recheck independent HC contract and permanent suite
        run: |
          set -euo pipefail
          python3 tests/test_v7_hc_oracle_f32.py
          python3 tests/test_v7_hc_pre_f32_scalar.py
          python3 tests/test_v7_one_row_attention_signed_zero.py
          make check

      - name: Freeze exact checks and remove temporary machinery
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/make_v7_layer4_route_fixture.py
          git rm tools/tighten_v7_route_oracle.py .github/workflows/v7-route-oracle-tighten.yml
          git diff --cached --check
          git commit -m "oracle: require exact F32 HC coefficients in V7 [skip ci]"
          git push origin HEAD:agent/v7-multilayer-localization
