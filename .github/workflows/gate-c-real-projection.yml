name: Gate C real projection

on:
  push:
    branches:
      - agent/gate-c-real-projection
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gate-c-real-projection
  cancel-in-progress: true

jobs:
  gate-c:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODEL: deepseek-ai/DeepSeek-V4-Flash-0731
      REVISION: 9e165c30e2704aec5d9d593cce3eebd58bbef1cb
      SNAPSHOT: reference/deepseek-v4-flash-0731
      FIXTURE: tests/fixtures/deepseek_v4/v2_wq_a_real
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and existing checks
        run: |
          make -j2
          make check

      - name: Fetch all pinned headers only
        run: |
          python3 tools/fetch_hf_headers.py \
            --model "$MODEL" \
            --revision "$REVISION" \
            --out "$SNAPSHOT"

      - name: Build tiny real projection fixture
        run: |
          rm -rf "$FIXTURE"
          python3 tools/make_v2_real_fixture.py "$SNAPSHOT" "$FIXTURE"
          test "$(stat -c %s "$FIXTURE/weight-rows0-8.e4m3.bin")" -eq 32768
          test "$(stat -c %s "$FIXTURE/weight-scale-row0.e8m0.bin")" -eq 32
          test "$(stat -c %s "$FIXTURE/input.bf16.bin")" -eq 8192
          test "$(stat -c %s "$FIXTURE/expected.bf16.bin")" -eq 16

      - name: Replay frozen real projection through scalar C
        run: python3 tests/test_v2_real_projection.py

      - name: Sanitizers
        run: make asan

      - name: Upload Gate C evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-real-projection
          retention-days: 30
          if-no-files-found: error
          path: |
            tests/fixtures/deepseek_v4/v2_wq_a_real/

      - name: Commit verified fixture
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "$FIXTURE" && git ls-files --error-unmatch "$FIXTURE/provenance.json" >/dev/null 2>&1; then
            echo "real Gate C fixture already frozen"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FIXTURE"
          git commit -m "fixtures: freeze real 0731 Gate C projection"
          git push origin HEAD:agent/gate-c-real-projection
