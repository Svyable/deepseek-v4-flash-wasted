name: Validate V7 maintainer review fixes

on:
  push:
    branches: [agent/v7-multilayer-localization]

permissions:
  contents: write

concurrency:
  group: v7-review-fix
  cancel-in-progress: true

jobs:
  review-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix one-row online-softmax oracle and add permanent regressions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tools/make_v6_attention_branch_fixture.py')
          s = p.read_text()
          anchor = '\n\ndef one_token_heads(x_bits, paths):\n'
          helper = r'''


def one_row_online_attention(q_bits, kv_bits, sink):
    """One valid KV row through the real online-softmax operation order.

    Algebraically this looks like ``kv / (1 + exp(sink-score))``, but the
    source kernel first accumulates ``BF16(exp(0)) * kv`` into a +0 F32
    accumulator. That operation is observably different for a -0 KV lane:
    +0 + -0 becomes +0 under round-to-nearest. Keep the operational order;
    do not replace this with direct division.
    """
    if len(q_bits) != HEAD or len(kv_bits) != HEAD:
        raise ValueError("one-row attention requires one full 512-value head")
    qf = [qref.bf16_to_f32(b) for b in q_bits]
    kvf = [qref.bf16_to_f32(b) for b in kv_bits]
    scale = hist.f32(HEAD ** -0.5)
    dot = hist.f32(0.0)
    for a, b in zip(qf, kvf):
        dot = hist.f32(dot + hist.f32(a * b))
    score = hist.f32(dot * scale)

    # First and only valid row in the online softmax block.
    best = score
    denom = hist.f32(0.0)
    acc = [hist.f32(0.0)] * HEAD
    e = hist.f32(math.exp(hist.f32(score - best)))
    denom = hist.f32(denom + e)
    e_bf16 = qref.bf16_to_f32(qref.bf16_bits(e))
    for k, v in enumerate(kvf):
        acc[k] = hist.f32(acc[k] + hist.f32(e_bf16 * v))

    denom = hist.f32(denom + hist.f32(math.exp(hist.f32(sink - best))))
    return [qref.bf16_bits(hist.f32(v / denom)) for v in acc]
          '''
          if 'def one_row_online_attention(' not in s:
              if s.count(anchor) != 1:
                  raise SystemExit(f'one_token_heads anchor count={s.count(anchor)}')
              s = s.replace(anchor, helper + anchor, 1)

          old = '''    kv = hist.qat_nope(kv1)\n    kvf = [qref.bf16_to_f32(b) for b in kv]\n    scale = hist.f32(HEAD ** -0.5)\n\n    heads = []\n    q_all = []\n    for h in range(N_HEADS):\n        qn = hist.head_norm(qb[h*HEAD:(h+1)*HEAD])\n        q_all.extend(qn)\n        qf = [qref.bf16_to_f32(b) for b in qn]\n        dot = hist.f32(0.0)\n        for a, b in zip(qf, kvf):\n            dot = hist.f32(dot + hist.f32(a * b))\n        score = hist.f32(dot * scale)\n        # One valid KV row. Online softmax best=score, value weight BF16(exp(0))=1.\n        denom = hist.f32(1.0 + hist.f32(math.exp(hist.f32(sinks[h] - score))))\n        heads.extend(qref.bf16_bits(hist.f32(v / denom)) for v in kvf)\n'''
          new = '''    kv = hist.qat_nope(kv1)\n\n    heads = []\n    q_all = []\n    for h in range(N_HEADS):\n        qn = hist.head_norm(qb[h*HEAD:(h+1)*HEAD])\n        q_all.extend(qn)\n        heads.extend(one_row_online_attention(qn, kv, sinks[h]))\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('one_token_heads implementation anchor drifted')
          p.write_text(s)

          test = Path('tests/test_v7_one_row_attention_signed_zero.py')
          test.write_text(r'''#!/usr/bin/env python3
# SPDX-License-Identifier: Apache-2.0
# Copyright 2026 The deepseek-v4-flash-wasted authors.
"""Pin one-row online-softmax signed-zero semantics independently.

The V7 layer-4 chain exposed a shortcut bug: direct ``kv / denom`` preserves a
negative-zero value lane, while the source online-softmax kernel first adds the
weighted value to a +0 F32 accumulator. Under round-to-nearest, +0 + -0 is +0.
This test makes that operation order load-bearing and also pins E4M3 0x80 decode
as negative zero.
"""

import math
import os
import sys

REPO = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))
sys.path.insert(0, os.path.join(REPO, 'tools'))
import make_v2_real_fixture as qref  # noqa: E402
import make_v5_attention_history_real_fixture as hist  # noqa: E402
import make_v6_attention_branch_fixture as attn  # noqa: E402


def main():
    neg_zero = qref.e4m3_float(0x80)
    if neg_zero != 0.0 or math.copysign(1.0, neg_zero) >= 0.0:
        raise AssertionError('E4M3 0x80 must decode to negative zero')
    if qref.bf16_bits(neg_zero) != 0x8000:
        raise AssertionError('negative-zero E4M3 decode must survive BF16 cast')

    q = [0x0000] * attn.HEAD
    kv = [0x0000] * attn.HEAD
    kv[17] = 0x3f80      # +1.0, proves ordinary value arithmetic too.
    kv[333] = 0x8000     # -0.0, the exact V7 layer-4 failure lane.

    got = attn.one_row_online_attention(q, kv, 0.0)
    if len(got) != attn.HEAD:
        raise AssertionError('one-row attention output geometry drifted')
    if got[17] != 0x3f00:  # 1 / (1 + exp(0)) = 0.5
        raise AssertionError(f'ordinary one-row value drifted: {got[17]:04x} != 3f00')
    if got[333] != 0x0000:
        raise AssertionError(f'online accumulator must canonicalize -0 lane to +0: {got[333]:04x}')

    # Known-wrong mutation: algebraically collapse the online accumulation to
    # direct value/denominator division. It must visibly preserve -0 instead.
    kvf = [qref.bf16_to_f32(b) for b in kv]
    denom = hist.f32(2.0)
    direct = [qref.bf16_bits(hist.f32(v / denom)) for v in kvf]
    if direct[333] != 0x8000:
        raise AssertionError('direct-division mutation no longer exposes signed-zero difference')
    if direct == got:
        raise AssertionError('direct-division mutation became invisible')

    print('PASS V7 one-row online-softmax preserves operational signed-zero semantics')
    print('runtime-order lane333=0x0000 direct-division mutation=0x8000')
    return 0


if __name__ == '__main__':
    raise SystemExit(main())
''')

          run = Path('tests/run.sh')
          r = run.read_text()
          anchor = '''# V7 infrastructure: compare chained expected/runtime layer-boundary traces,\n# reject stale manifests/broken output->input chains, and stop at the first\n# differing layer/boundary rather than reporting a downstream symptom.\ndeepseek_replay "V7 — fail-closed first-divergence layer trace localizer" \\\n                "test_v7_localize.py"\n'''
          block = '''# V7 precision boundaries found by real chained-layer acquisition. These are\n# permanent because each caught an otherwise plausible, near-bit-exact oracle.\ndeepseek_replay "V7 — bit-exact independent F32 HyperConnection oracle" \\\n                "test_v7_hc_oracle_f32.py"\ndeepseek_replay "V7 — hc_pre sequential F32 reduction boundary" \\\n                "test_v7_hc_pre_f32_scalar.py"\ndeepseek_replay "V7 — sparse FP8 scalar differential and signed-zero cases" \\\n                "test_v7_sparse_fp8_oracle.py"\ndeepseek_replay "V7 — one-row online-softmax signed-zero operation order" \\\n                "test_v7_one_row_attention_signed_zero.py"\n\n'''
          if block not in r:
              if r.count(anchor) != 1:
                  raise SystemExit(f'tests/run V7 localizer anchor count={r.count(anchor)}')
              r = r.replace(anchor, block + anchor, 1)
              run.write_text(r)
          PY
          chmod +x tests/test_v7_one_row_attention_signed_zero.py
          git diff --check

      - name: Run focused boundary regressions
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/make_v6_attention_branch_fixture.py \
            tests/test_v7_one_row_attention_signed_zero.py
          python3 tests/test_v7_hc_oracle_f32.py
          python3 tests/test_v7_hc_pre_f32_scalar.py
          python3 tests/test_v7_sparse_fp8_oracle.py
          python3 tests/test_v7_one_row_attention_signed_zero.py
          python3 tests/test_v5_attention_ratio128_coherent_real.py
          python3 tests/test_v5_csa_attention_real.py
          python3 tests/test_v6_attention_composition_real.py
          python3 tests/test_v6_layer3_full_real.py

      - name: Run complete frozen suites
        run: |
          set -euo pipefail
          make check
          make asan

      - name: Freeze review fixes and self-remove workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/make_v6_attention_branch_fixture.py \
                  tests/test_v7_one_row_attention_signed_zero.py \
                  tests/run.sh
          git rm .github/workflows/v7-review-fix.yml
          git diff --cached --check
          git commit -m "test: pin V7 precision and signed-zero boundaries [skip ci]"
          git push origin HEAD:agent/v7-multilayer-localization
