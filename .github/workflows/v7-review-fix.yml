name: Validate V7 review fixes

on:
  push:
    branches: [agent/v7-multilayer-localization]

permissions:
  contents: write

concurrency:
  group: v7-review-fix
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic review patch
        run: |
          set -euo pipefail
          python3 tools/apply_v7_review_fix.py
          chmod +x tests/test_v7_one_row_attention_signed_zero.py
          git diff --check

      - name: Focused precision and attention regressions
        run: |
          set -euo pipefail
          python3 -m py_compile tools/make_v6_attention_branch_fixture.py tests/test_v7_one_row_attention_signed_zero.py
          python3 tests/test_v7_hc_oracle_f32.py
          python3 tests/test_v7_hc_pre_f32_scalar.py
          python3 tests/test_v7_sparse_fp8_oracle.py
          python3 tests/test_v7_one_row_attention_signed_zero.py
          python3 tests/test_v5_attention_ratio128_coherent_real.py
          python3 tests/test_v5_csa_attention_real.py
          python3 tests/test_v6_attention_composition_real.py
          python3 tests/test_v6_layer3_full_real.py

      - name: Complete frozen suites
        run: |
          set -euo pipefail
          make check
          make asan

      - name: Freeze fixes and remove temporary machinery
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/make_v6_attention_branch_fixture.py tests/test_v7_one_row_attention_signed_zero.py tests/run.sh
          git rm tools/apply_v7_review_fix.py .github/workflows/v7-review-fix.yml
          git diff --cached --check
          git commit -m "test: pin V7 precision and signed-zero boundaries [skip ci]"
          git push origin HEAD:agent/v7-multilayer-localization
