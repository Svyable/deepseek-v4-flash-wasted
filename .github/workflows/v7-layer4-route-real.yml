name: Acquire real chained layer-4 V7 route boundary

on:
  push:
    branches: [agent/v7-multilayer-localization]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v7-layer4-route-real
  cancel-in-progress: true

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MODEL: deepseek-ai/DeepSeek-V4-Flash-0731
      REVISION: 9e165c30e2704aec5d9d593cce3eebd58bbef1cb
      SNAPSHOT: reference/deepseek-v4-flash-0731
      FIXTURE: tests/fixtures/deepseek_v4/v7_layer4_route_real
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cheap bit-exact chained-boundary preflight
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/v7_hc_oracle.py \
            tools/make_v7_layer4_route_fixture.py \
            tests/test_v7_hc_oracle_f32.py \
            tests/test_v7_sparse_fp8_oracle.py \
            tests/test_v7_layer4_route_real.py
          python3 tests/test_v7_hc_oracle_f32.py
          python3 tests/test_v7_hc_pre_f32_scalar.py
          python3 tests/test_v7_sparse_fp8_oracle.py
          python3 tests/test_v7_localize.py
          python3 tests/test_v6_layer3_full_real.py
          python3 tests/test_v6_attention_composition_real.py

      - name: Fetch immutable 0731 headers
        run: |
          set -euo pipefail
          python3 tools/fetch_hf_headers.py \
            --model "$MODEL" --revision "$REVISION" --out "$SNAPSHOT"

      - name: Build real layer-3 output to layer-4 router fixture
        run: |
          set -euo pipefail
          rm -rf "$FIXTURE"
          python3 tools/make_v7_layer4_route_fixture.py "$SNAPSHOT" "$FIXTURE"

      - name: Replay compact chained layer-4 route offline
        run: |
          set -euo pipefail
          python3 tests/test_v7_layer4_route_real.py

      - name: Upload compact layer-4 route fixture
        uses: actions/upload-artifact@v4
        with:
          name: v7-layer4-route-real
          retention-days: 30
          if-no-files-found: error
          path: tests/fixtures/deepseek_v4/v7_layer4_route_real/

      - name: Freeze green chained layer-4 route fixture
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FIXTURE"
          if git diff --cached --quiet; then
            echo "V7 layer-4 route fixture already frozen and unchanged"
            exit 0
          fi
          git commit -m "reference: freeze real chained layer-4 route boundary [skip ci]"
          git push origin HEAD:agent/v7-multilayer-localization
