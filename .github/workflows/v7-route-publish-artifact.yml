name: Publish recovered V7 layer-4 route artifact

on:
  push:
    branches: [agent/v7-multilayer-localization]

permissions:
  actions: read
  contents: write

concurrency:
  group: v7-route-publish-artifact
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FIXTURE: tests/fixtures/deepseek_v4/v7_layer4_route_real
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover arithmetic-green fixture from run 31438142112
        uses: actions/download-artifact@v4
        with:
          name: v7-layer4-route-real
          path: tests/fixtures/deepseek_v4/v7_layer4_route_real
          github-token: ${{ github.token }}
          repository: Svyable/deepseek-v4-flash-wasted
          run-id: 31438142112

      - name: Verify recovered evidence before publishing
        run: |
          set -euo pipefail
          python3 tests/test_v7_layer4_route_real.py
          python3 - <<'PY'
          import json
          p=json.load(open('tests/fixtures/deepseek_v4/v7_layer4_route_real/provenance.json'))
          want=[237,90,185,120,197,239]
          if p.get('revision') != '9e165c30e2704aec5d9d593cce3eebd58bbef1cb':
              raise SystemExit('recovered route revision drifted')
          if p.get('router',{}).get('ids_topk_order') != want:
              raise SystemExit(f"recovered route IDs drifted: {p.get('router',{}).get('ids_topk_order')}")
          if p.get('hc_crosschecks',{}).get('attn_post_comb_exact_f32') is not True or p.get('hc_crosschecks',{}).get('ffn_post_comb_exact_f32') is not True:
              raise SystemExit('recovered HC exact-F32 evidence drifted')
          print('PASS recovered V7 route artifact identity and exact-HC provenance')
          PY
          git diff --check

      - name: Publish fixture only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FIXTURE"
          if git diff --cached --quiet; then
            echo "Recovered route fixture already published"
            exit 0
          fi
          git commit -m "reference: freeze exact chained layer-4 route boundary [skip ci]"
          git push origin HEAD:agent/v7-multilayer-localization
