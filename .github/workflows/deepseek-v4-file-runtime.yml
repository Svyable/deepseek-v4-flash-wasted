name: DeepSeek V4 file runtime

on:
  pull_request:
    paths:
      - "src/deepseek_v4_runtime.*"
      - "src/deepseek_v4_file_runtime.c"
      - "src/deepseek_v4_manifest.*"
      - "src/deepseek_v4_container_contract.*"
      - "src/ecache.*"
      - "src/platform.h"
      - "tests/test_deepseek_v4_file_runtime.c"
      - "Makefile"
      - ".github/workflows/deepseek-v4-file-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  file-runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build library and run actual-file ownership test
        run: |
          make libwaste.a
          ${CC:-cc} ${CFLAGS:--O2 -std=gnu11 -Wall -Wextra} \
            -o test_ds_file_runtime tests/test_deepseek_v4_file_runtime.c \
            libwaste.a -lm -lpthread
          ./test_ds_file_runtime

      - name: Run actual-file ownership test under ASan and UBSan
        run: |
          make clean
          SAN="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all -g -O1"
          BASE="-std=gnu11 -Wall -Wextra -DVQ_SUPER=2 -MMD -MP"
          make libwaste.a CFLAGS="$BASE $SAN" LDLIBS="-lm -lpthread $SAN"
          ${CC:-cc} $BASE $SAN -o test_ds_file_runtime \
            tests/test_deepseek_v4_file_runtime.c libwaste.a -lm -lpthread $SAN
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=print_stacktrace=1 \
            ./test_ds_file_runtime
