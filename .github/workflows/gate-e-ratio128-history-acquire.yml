name: Acquire real 0731 ratio-128 history

on:
  push:
    branches:
      - agent/gate-e-attention-ratio128-history-real
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gate-e-ratio128-history-acquire
  cancel-in-progress: true

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MODEL: deepseek-ai/DeepSeek-V4-Flash-0731
      REVISION: 9e165c30e2704aec5d9d593cce3eebd58bbef1cb
      SNAPSHOT: reference/deepseek-v4-flash-0731
      FIXTURE: tests/fixtures/deepseek_v4/v5_attention_history_ratio128_real
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Frozen compressor and history preflight
        run: |
          set -euo pipefail
          python3 tests/test_v5_compressor_scalar.py
          python3 tests/test_v5_compressor_real.py
          python3 tests/test_v5_attention_history_scalar.py

      - name: Fetch immutable 0731 safetensors headers
        run: |
          set -euo pipefail
          python3 tools/fetch_hf_headers.py \
            --model "$MODEL" \
            --revision "$REVISION" \
            --out "$SNAPSHOT"

      - name: Materialize bounded real compressed-history fixture
        run: |
          set -euo pipefail
          rm -rf "$FIXTURE"
          python3 tools/make_v5_attention_history_real_fixture.py "$SNAPSHOT" "$FIXTURE"
          test "$(stat -c %s "$FIXTURE/q-pos255-head0.bf16.bin")" -eq 1024
          test "$(stat -c %s "$FIXTURE/local-kv-0-255.bf16.bin")" -eq 262144
          test "$(stat -c %s "$FIXTURE/attn-sink-head0.f32.bin")" -eq 4
          test "$(stat -c %s "$FIXTURE/topk-row255.i32.bin")" -eq 520
          test "$(stat -c %s "$FIXTURE/expected-attn-row255.bf16.bin")" -eq 1024

      - name: Replay history composition through scalar C
        run: python3 tests/test_v5_attention_history_real.py

      - name: Existing frozen suite
        run: |
          set -euo pipefail
          make -j2
          make check

      - name: Upload history evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-e-ratio128-history-real
          retention-days: 30
          if-no-files-found: error
          path: tests/fixtures/deepseek_v4/v5_attention_history_ratio128_real/

      - name: Freeze verified history fixture
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FIXTURE"
          if git diff --cached --quiet; then
            echo "real history fixture already frozen"
            exit 0
          fi
          git commit -m "fixtures: freeze real 0731 ratio-128 history [skip ci]"
          git push origin HEAD:agent/gate-e-attention-ratio128-history-real
