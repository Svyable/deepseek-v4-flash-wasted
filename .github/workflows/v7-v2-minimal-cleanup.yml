name: Validate minimal V7 V2 cleanup

on:
  push:
    branches: [agent/v7-multilayer-localization]

permissions:
  contents: write

concurrency:
  group: v7-v2-minimal-cleanup
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore base and apply only signed-zero hunk
        run: |
          set -euo pipefail
          python3 tools/restore_v7_v2_minimal.py
          git diff --check
          git diff --unified=1 98604765d61c44c25888c32d4b7d95422a02caf7 -- tools/make_v2_real_fixture.py
          python3 - <<'PY'
          import subprocess
          line = subprocess.check_output([
              'git','diff','--numstat','98604765d61c44c25888c32d4b7d95422a02caf7','--','tools/make_v2_real_fixture.py'
          ], text=True).strip()
          add, delete, path = line.split('\t')
          if path != 'tools/make_v2_real_fixture.py' or int(add) > 6 or int(delete) > 1:
              raise SystemExit(f'non-minimal V2 diff remains: {line}')
          print('minimal V2 diff:', line)
          PY

      - name: Focused signed-zero and inherited oracle regressions
        run: |
          set -euo pipefail
          python3 tests/test_v7_sparse_fp8_oracle.py
          python3 tests/test_v7_one_row_attention_signed_zero.py
          python3 tests/test_v5_attention_ratio128_coherent_real.py
          python3 tests/test_v5_csa_attention_real.py
          python3 tests/test_v6_attention_composition_real.py
          python3 tests/test_v6_layer3_full_real.py

      - name: Complete frozen suites
        run: |
          set -euo pipefail
          make check
          make asan

      - name: Freeze minimal cleanup and remove temporary machinery
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/make_v2_real_fixture.py
          git rm tools/restore_v7_v2_minimal.py .github/workflows/v7-v2-minimal-cleanup.yml
          git diff --cached --check
          git commit -m "oracle: keep only minimal E4M3 signed-zero fix [skip ci]"
          git push origin HEAD:agent/v7-multilayer-localization
