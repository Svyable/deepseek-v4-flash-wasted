name: Gate E ratio-128 compressor

on:
  push:
    branches:
      - agent/gate-e-attention-ratio128
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gate-e-ratio128
  cancel-in-progress: true

jobs:
  scalar:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Existing frozen suite
        run: |
          make -j2
          make check
      - name: Ratio-128 compressor source-contract tests
        run: python3 tests/test_v5_compressor_scalar.py
      - name: Sanitizers
        run: make asan

  compressor:
    needs: scalar
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODEL: deepseek-ai/DeepSeek-V4-Flash-0731
      REVISION: 9e165c30e2704aec5d9d593cce3eebd58bbef1cb
      SNAPSHOT: reference/deepseek-v4-flash-0731
      FIXTURE: tests/fixtures/deepseek_v4/v5_compressor_ratio128_real
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pinned 0731 headers only
        run: |
          python3 tools/fetch_hf_headers.py \
            --model "$MODEL" \
            --revision "$REVISION" \
            --out "$SNAPSHOT"

      - name: Build bounded real ratio-128 compressor fixture
        run: |
          rm -rf "$FIXTURE"
          python3 tools/make_v5_compressor_ratio128_fixture.py "$SNAPSHOT" "$FIXTURE"
          test "$(stat -c %s "$FIXTURE/input.bf16.bin")" -eq 2097152
          test "$(stat -c %s "$FIXTURE/wkv.bf16.bin")" -eq 4194304
          test "$(stat -c %s "$FIXTURE/wgate.bf16.bin")" -eq 4194304
          test "$(stat -c %s "$FIXTURE/ape.f32.bin")" -eq 262144
          test "$(stat -c %s "$FIXTURE/norm.f32.bin")" -eq 2048
          test "$(stat -c %s "$FIXTURE/pooled-before-norm.bf16.bin")" -eq 2048
          test "$(stat -c %s "$FIXTURE/post-norm.bf16.bin")" -eq 2048
          test "$(stat -c %s "$FIXTURE/post-yarn-rope.bf16.bin")" -eq 2048
          test "$(stat -c %s "$FIXTURE/compressed-kv.bf16.bin")" -eq 2048

      - name: Replay real compressor through WASTE scalar C
        run: python3 tests/test_v5_compressor_real.py

      - name: Upload compressor evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-e-ratio128-compressor-real
          retention-days: 30
          if-no-files-found: error
          path: tests/fixtures/deepseek_v4/v5_compressor_ratio128_real/

      - name: Freeze verified fixture
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FIXTURE"
          if git diff --cached --quiet; then
            echo "compressor fixture already frozen"
            exit 0
          fi
          git commit -m "fixtures: freeze real 0731 ratio-128 compressor evidence"
          git push origin HEAD:agent/gate-e-attention-ratio128
