name: Record corrected Gate-H HC precision boundary

on:
  push:
    branches: [agent/gate-h-layer3-full]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply maintained evidence updates
        run: |
          set -euo pipefail
          python3 tools/apply_gate_h_hc_precision_docs.py
          git diff --check
          grep -F 'c3d175f8170b33f344a471739640f683c41fb8b9c2c69f1529f70b0479a1d8f7' ROADMAP.md docs/VALIDATION.md docs/EXPERIMENTS.md
          grep -F '65 passed, 0 failed, 13 skipped' ROADMAP.md
      - name: Freeze maintained docs only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md docs/VALIDATION.md docs/EXPERIMENTS.md
          git rm tools/apply_gate_h_hc_precision_docs.py
          git diff --cached --check
          git commit -m "docs: record Gate-H exact F32 HC correction [skip ci]"
          git push origin HEAD:agent/gate-h-layer3-full
